<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daty</title>
  <link rel="icon" href="assets/favicon.ico" />
  <style>
    @font-face {
      font-family: "Antrophic Sans Display";
      src: local("Antrophic Sans Display"), local("Anthropic Sans Display");
      font-display: swap;
    }

    @font-face {
      font-family: "SF Pro";
      src: url("assets/fonts/SF-Pro-Display-Medium.otf") format("opentype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SF Pro";
      src: url("assets/fonts/SF-Pro-Display-Semibold.otf") format("opentype");
      font-weight: 600 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "SF Pro";
      src: url("assets/fonts/SF-Pro-Display-Bold.otf") format("opentype");
      font-weight: 800 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: light dark;
      --site-bg-image: none;
      --wallpaper-opacity: 0;
      --wallpaper-scrim: rgba(255, 255, 255, 0.34);
      --bg: #f5f5f5;
      --surface: rgba(255, 255, 255, 0.2);
      --surface-strong: rgba(255, 255, 255, 0.34);
      --surface-soft: rgba(255, 255, 255, 0.16);
      --surface-hover: rgba(255, 255, 255, 0.28);
      --border: rgba(255, 255, 255, 0.42);
      --border-strong: rgba(255, 255, 255, 0.66);
      --glass-highlight: rgba(255, 255, 255, 0.74);
      --glass-sheen: rgba(255, 255, 255, 0.36);
      --glass-glow: rgba(255, 255, 255, 0.2);
      --liquid-blur: blur(24px) saturate(190%) contrast(104%) brightness(106%);
      --glass-shadow: 0 22px 60px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.68), inset 0 -1px 0 rgba(255, 255, 255, 0.18), inset 0 -18px 36px rgba(255, 255, 255, 0.055);
      --glass-shadow-soft: 0 12px 32px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.62), inset 0 -1px 0 rgba(255, 255, 255, 0.12);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --muted-strong: #424245;
      --accent: #111111;
      --accent-strong: #000000;
      --accent-text: #ffffff;
      --green: #111111;
      --amber: #111111;
      --red: #111111;
      --shadow: var(--glass-shadow);
      --shadow-soft: var(--glass-shadow-soft);
      --inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.58);
      --radius-xs: 14px;
      --radius-sm: 18px;
      --radius: 26px;
      --radius-lg: 34px;
      --font-display: "Antrophic Sans Display", "Anthropic Sans Display", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      --font-body: "SF Pro", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --wallpaper-scrim: rgba(0, 0, 0, 0.24);
      --bg: #050506;
      --surface: rgba(22, 23, 28, 0.32);
      --surface-strong: rgba(38, 39, 47, 0.42);
      --surface-soft: rgba(255, 255, 255, 0.08);
      --surface-hover: rgba(255, 255, 255, 0.13);
      --border: rgba(255, 255, 255, 0.18);
      --border-strong: rgba(255, 255, 255, 0.34);
      --glass-highlight: rgba(255, 255, 255, 0.3);
      --glass-sheen: rgba(255, 255, 255, 0.16);
      --glass-glow: rgba(255, 255, 255, 0.14);
      --liquid-blur: blur(26px) saturate(178%) contrast(106%) brightness(104%);
      --glass-shadow: 0 24px 70px rgba(0, 0, 0, 0.46), inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 0 rgba(255, 255, 255, 0.08), inset 0 -18px 36px rgba(255, 255, 255, 0.025);
      --glass-shadow-soft: 0 14px 42px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 -1px 0 rgba(255, 255, 255, 0.06);
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --muted-strong: #d2d2d7;
      --accent: #f5f5f7;
      --accent-strong: #ffffff;
      --accent-text: #000000;
      --green: #f5f5f7;
      --amber: #f5f5f7;
      --red: #f5f5f7;
      --shadow: var(--glass-shadow);
      --shadow-soft: var(--glass-shadow-soft);
      --inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(120deg, #ffffff 0%, #f1f1f3 28%, #ffffff 50%, #dcdde1 78%, #ffffff 100%);
      color: var(--text);
      font-family: var(--font-body);
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      position: relative;
      overflow-x: hidden;
      isolation: isolate;
    }

    html[data-theme="dark"] body {
      background:
        linear-gradient(120deg, #000000 0%, #111113 34%, #232326 68%, #050505 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
    }

    body::before {
      inset: 0;
      z-index: -2;
      background-image: var(--site-bg-image);
      background-position: center;
      background-size: cover;
      opacity: var(--wallpaper-opacity);
      filter: saturate(118%) contrast(103%);
      transition: opacity 220ms ease;
    }

    body::after {
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, var(--wallpaper-scrim), rgba(255, 255, 255, 0.04) 48%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.06) 42%, rgba(0, 0, 0, 0.06) 100%);
    }

    html[data-theme="dark"] body::after {
      background:
        linear-gradient(180deg, var(--wallpaper-scrim), rgba(0, 0, 0, 0.08) 54%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.1) 44%, rgba(255, 255, 255, 0.06) 100%);
    }

    html.has-custom-bg {
      --wallpaper-opacity: 0.92;
    }

    button,
    input,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      border: 0;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 24px;
    }

    .app-header {
      display: grid;
      gap: 22px;
      margin-bottom: 22px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 0;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 48px;
      line-height: 1;
      font-weight: 600;
    }

    h2 {
      font-family: var(--font-body);
      font-size: 27px;
      line-height: 1.15;
      font-weight: 700;
    }

    h3 {
      font-family: var(--font-body);
      font-size: 17px;
      line-height: 1.2;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .clock {
      min-width: 106px;
      min-height: 48px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft), var(--inner-shadow);
      backdrop-filter: blur(26px) saturate(160%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .clock strong {
      display: block;
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .theme-switch,
    .segments {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft), var(--inner-shadow);
      backdrop-filter: blur(26px) saturate(160%);
    }

    .theme-switch button,
    .segments button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      min-height: 42px;
      padding: 0;
      border-radius: 999px;
      color: var(--muted-strong);
      background: transparent;
      font-size: 14px;
      font-weight: 750;
      line-height: 1;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
      white-space: nowrap;
    }

    .theme-switch button:hover,
    .segments button:hover {
      color: var(--text);
      transform: translateY(-1px);
    }

    .theme-switch button.is-active,
    .segments button.is-active {
      background: var(--surface-strong);
      color: var(--text);
      box-shadow: 0 9px 24px rgba(0, 0, 0, 0.11);
    }

    .segments {
      width: fit-content;
    }

    .icon {
      width: 20px;
      height: 20px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .icon use {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
    }

    .btn[data-tooltip],
    .segments button[data-tooltip],
    .theme-switch button[data-tooltip],
    .remove-order[data-tooltip] {
      position: relative;
    }

    .btn[data-tooltip]::after,
    .segments button[data-tooltip]::after,
    .theme-switch button[data-tooltip]::after,
    .remove-order[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 9px);
      z-index: 40;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--text);
      box-shadow: var(--shadow-soft);
      font-size: 12px;
      font-weight: 750;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(4px);
      transition: opacity 140ms ease, transform 140ms ease;
      white-space: nowrap;
    }

    .btn[data-tooltip]:hover::after,
    .segments button[data-tooltip]:hover::after,
    .theme-switch button[data-tooltip]:hover::after,
    .remove-order[data-tooltip]:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .header-actions [data-tooltip]::after,
    .segments [data-tooltip]::after {
      top: calc(100% + 9px);
      bottom: auto;
      transform: translateX(-50%) translateY(-4px);
    }

    .header-actions [data-tooltip]:hover::after,
    .segments [data-tooltip]:hover::after {
      transform: translateX(-50%) translateY(0);
    }

    .view {
      display: none;
    }

    .view.is-active {
      display: grid;
      gap: 20px;
      animation: fadeIn 180ms ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
    }

    .stat {
      min-height: 108px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-soft), var(--inner-shadow);
      backdrop-filter: blur(28px) saturate(160%);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 11px;
      font-family: var(--font-body);
      font-size: 31px;
      line-height: 1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat.color-stat {
      border-color: color-mix(in srgb, var(--stat-color) 68%, var(--border));
    }

    .tool-panel {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow), var(--inner-shadow);
      backdrop-filter: blur(30px) saturate(165%);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .panel-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .panel-copy {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .notice {
      display: none;
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      font-size: 14px;
      font-weight: 760;
      line-height: 1.35;
    }

    .notice.is-visible {
      display: block;
    }

    .notice.warning {
      color: var(--amber);
      border-color: color-mix(in srgb, var(--amber), transparent 62%);
      background: color-mix(in srgb, var(--amber), transparent 90%);
    }

    .notice.error {
      color: var(--red);
      border-color: color-mix(in srgb, var(--red), transparent 62%);
      background: color-mix(in srgb, var(--red), transparent 91%);
    }

    .notice.success {
      color: var(--green);
      border-color: color-mix(in srgb, var(--green), transparent 62%);
      background: color-mix(in srgb, var(--green), transparent 91%);
    }

    .order-list {
      display: grid;
      gap: 12px;
    }

    .inventory-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .inventory-row {
      display: grid;
      align-content: space-between;
      gap: 18px;
      min-height: 178px;
      padding: 24px 20px 20px;
      border: 1.5px solid color-mix(in srgb, var(--stock-color) 72%, var(--border));
      border-radius: var(--radius);
      background: var(--surface-soft);
      box-shadow: var(--inner-shadow);
      overflow: hidden;
      position: relative;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .inventory-row::before {
      content: "";
      position: absolute;
      top: 24px;
      right: 70px;
      z-index: 1;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--red);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--red), transparent 78%);
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .inventory-row:hover {
      border-color: color-mix(in srgb, var(--stock-color) 88%, var(--border-strong));
      box-shadow: var(--shadow-soft), var(--inner-shadow);
      transform: translateY(-2px);
    }

    .inventory-row.is-low {
      border-color: color-mix(in srgb, var(--stock-color) 72%, var(--border));
    }

    .inventory-row.is-low::before {
      opacity: 1;
      transform: scale(1);
    }

    .remove-stock {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface-strong) 88%, transparent);
      color: var(--muted-strong);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .remove-stock:hover {
      color: var(--red);
      background: color-mix(in srgb, var(--red), transparent 91%);
      transform: translateY(-1px);
    }

    .remove-stock .icon {
      width: 17px;
      height: 17px;
    }

    .item-name strong {
      display: block;
      font-family: var(--font-body);
      font-size: 24px;
      font-weight: 700;
      line-height: 1.05;
    }

    .stock-kicker {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
      text-transform: uppercase;
    }

    .item-name small {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .quantity-input {
      width: 100%;
      min-height: 54px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-strong);
      color: var(--text);
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      outline: none;
      font-variant-numeric: tabular-nums;
      position: relative;
      z-index: 1;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .quantity-input:focus,
    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent), transparent 84%);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      min-height: 50px;
      padding: 0;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--inner-shadow);
      transition: transform 160ms ease, opacity 160ms ease, background 160ms ease, box-shadow 160ms ease;
      white-space: nowrap;
    }

    .btn:hover {
      box-shadow: var(--shadow-soft), var(--inner-shadow);
      transform: translateY(-2px);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 16px 34px color-mix(in srgb, var(--accent), transparent 72%);
    }

    .btn-primary:hover {
      background: var(--accent-strong);
    }

    .btn-secondary {
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--text);
    }

    .btn-danger {
      border: 1px solid color-mix(in srgb, var(--red), transparent 64%);
      background: color-mix(in srgb, var(--red), transparent 91%);
      color: var(--red);
    }

    .order-form {
      display: grid;
      grid-template-columns: 1.25fr 0.9fr 0.9fr 0.75fr auto;
      gap: 14px;
      align-items: end;
    }

    .field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .field label {
      color: var(--muted-strong);
      font-size: 12px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 54px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-strong);
      color: var(--text);
      outline: none;
      font-size: 15px;
      font-weight: 650;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .field input::placeholder {
      color: color-mix(in srgb, var(--muted), transparent 18%);
    }

    .field.has-error input {
      border-color: var(--red);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--red), transparent 86%);
    }

    .quantity-toggle {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      min-height: 54px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-strong);
    }

    .quantity-choice {
      border-radius: 999px;
      background: transparent;
      color: var(--muted-strong);
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
      transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .quantity-choice.is-active {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 10px 24px color-mix(in srgb, var(--accent), transparent 74%);
    }

    .history-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .counter {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .history-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .history-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .history-search {
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--muted);
      box-shadow: var(--inner-shadow);
    }

    .history-search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 650;
    }

    .history-search input::placeholder {
      color: color-mix(in srgb, var(--muted), transparent 15%);
    }

    .order-item {
      display: grid;
      grid-template-columns: minmax(180px, 1.2fr) 138px 118px 104px 134px auto;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--border);
      border-left: 7px solid var(--order-color, var(--accent));
      border-radius: var(--radius);
      background: var(--surface-soft);
      box-shadow: var(--inner-shadow);
      animation: fadeIn 180ms ease both;
      transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .order-item:hover {
      border-color: var(--border-strong);
      background: var(--surface-hover);
      box-shadow: var(--shadow-soft), var(--inner-shadow);
      transform: translateY(-2px);
    }

    .order-main strong {
      display: block;
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .order-main small,
    .order-meta small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .color-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      width: fit-content;
      max-width: 100%;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--order-color, var(--surface-strong));
      color: var(--order-text, #111111);
      font-size: 13px;
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .amount {
      color: var(--text);
      font-family: var(--font-body);
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .amount span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .remove-order {
      width: 42px;
      height: 42px;
      min-width: 42px;
      min-height: 42px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--red), transparent 68%);
      background: color-mix(in srgb, var(--red), transparent 92%);
      color: var(--red);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .empty {
      padding: 34px;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      background: var(--surface-soft);
    }

    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 30;
      min-width: 240px;
      max-width: min(440px, calc(100% - 32px));
      transform: translateX(-50%) translateY(18px);
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-strong);
      color: var(--text);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      text-align: center;
      font-size: 14px;
      font-weight: 760;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
      background: rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .modal-backdrop.is-visible {
      display: flex;
    }

    .modal {
      width: min(460px, 100%);
      max-height: calc(100vh - 40px);
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface-strong);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .color-form {
      display: grid;
      gap: 14px;
    }

    .color-input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 66px;
      gap: 10px;
      align-items: end;
    }

    .color-sample {
      width: 100%;
      height: 54px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-strong);
      padding: 4px;
    }

    .color-sample input {
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }

    .clock,
    .theme-switch,
    .segments,
    .stat,
    .tool-panel,
    .inventory-row,
    .btn,
    .field input,
    .field select,
    .quantity-toggle,
    .quantity-choice,
    .history-search,
    .order-item,
    .amount,
    .remove-order,
    .remove-stock,
    .empty,
    .toast,
    .modal,
    .color-sample {
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--glass-highlight), transparent 42%), rgba(255, 255, 255, 0.018) 34%, color-mix(in srgb, var(--surface), transparent 14%) 100%),
        color-mix(in srgb, var(--surface), transparent 4%);
      border-color: color-mix(in srgb, var(--border), transparent 8%);
      box-shadow: var(--shadow-soft);
      backdrop-filter: var(--liquid-blur);
      -webkit-backdrop-filter: var(--liquid-blur);
    }

    .clock,
    .theme-switch,
    .segments,
    .stat,
    .tool-panel,
    .inventory-row,
    .btn,
    .quantity-toggle,
    .quantity-choice,
    .history-search,
    .order-item,
    .amount,
    .remove-order,
    .remove-stock,
    .empty,
    .toast,
    .modal,
    .color-sample {
      position: relative;
      overflow: hidden;
    }

    .clock::before,
    .theme-switch::before,
    .segments::before,
    .stat::before,
    .tool-panel::before,
    .btn::before,
    .quantity-toggle::before,
    .quantity-choice::before,
    .history-search::before,
    .order-item::before,
    .amount::before,
    .remove-order::before,
    .remove-stock::before,
    .empty::before,
    .toast::before,
    .modal::before,
    .color-sample::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(150deg, rgba(255, 255, 255, 0.58), transparent 20%, transparent 72%, rgba(255, 255, 255, 0.09)),
        radial-gradient(90px 48px at 24% 7%, var(--glass-sheen), transparent 76%),
        radial-gradient(110px 62px at 82% 13%, var(--glass-glow), transparent 78%);
      opacity: 0.52;
      mix-blend-mode: screen;
    }

    .inventory-row::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(180px 92px at 18% 0%, color-mix(in srgb, var(--stock-color) 18%, rgba(255, 255, 255, 0.32)), transparent 72%),
        linear-gradient(146deg, rgba(255, 255, 255, 0.24), transparent 24%, transparent 78%, color-mix(in srgb, var(--stock-color) 14%, transparent));
      opacity: 0.44;
      mix-blend-mode: screen;
    }

    .clock > *,
    .theme-switch > *,
    .segments > *,
    .stat > *,
    .tool-panel > *,
    .inventory-row > *,
    .btn > *,
    .quantity-toggle > *,
    .quantity-choice > *,
    .history-search > *,
    .order-item > *,
    .amount > *,
    .remove-order > *,
    .remove-stock > *,
    .empty > *,
    .toast > *,
    .modal > *,
    .color-sample > * {
      position: relative;
      z-index: 1;
    }

    .btn,
    .theme-switch button,
    .segments button,
    .quantity-choice,
    .remove-order,
    .remove-stock {
      border: 1px solid color-mix(in srgb, var(--border-strong), transparent 14%);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.54), inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    }

    .btn-primary,
    .quantity-choice.is-active {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.44), color-mix(in srgb, var(--accent), transparent 12%) 36%, color-mix(in srgb, var(--accent), #ffffff 10%));
      color: var(--accent-text);
      box-shadow: 0 12px 30px color-mix(in srgb, var(--accent), transparent 68%), inset 0 1px 0 rgba(255, 255, 255, 0.58), inset 0 -1px 0 rgba(255, 255, 255, 0.14);
    }

    .btn-secondary,
    .theme-switch button.is-active,
    .segments button.is-active {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.38), color-mix(in srgb, var(--surface-strong), transparent 10%) 56%, rgba(255, 255, 255, 0.08));
      color: var(--text);
    }

    .btn-danger,
    .remove-order {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.32), color-mix(in srgb, var(--red), transparent 86%) 56%, rgba(255, 255, 255, 0.06));
      color: var(--red);
      border-color: color-mix(in srgb, var(--red), transparent 48%);
    }

    .order-item {
      border-left: 7px solid var(--order-color, var(--accent));
    }

    .color-pill {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.54), 0 8px 18px rgba(0, 0, 0, 0.08);
    }

    [data-tooltip]::after {
      content: none !important;
      display: none !important;
    }

    .floating-tooltip {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 120;
      max-width: min(260px, calc(100vw - 24px));
      padding: 8px 11px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.62), var(--surface-strong) 54%, rgba(255, 255, 255, 0.16));
      color: var(--text);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      font-size: 12px;
      font-weight: 760;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-999px, -999px, 0) scale(0.96);
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .floating-tooltip.is-visible {
      opacity: 1;
      transform: translate3d(var(--tooltip-x), var(--tooltip-y), 0) scale(1);
    }

    @media (max-width: 1080px) {
      .stats {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }

      .order-form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .order-form .btn {
        grid-column: span 2;
      }

      .order-item {
        grid-template-columns: minmax(180px, 1fr) 130px 112px 100px;
      }

      .order-meta,
      .remove-order {
        grid-column: span 2;
      }
    }

    @media (max-width: 760px) {
      .app {
        width: min(100% - 24px, 1180px);
        padding-top: 20px;
      }

      .header-row,
      .panel-head,
      .history-head {
        flex-direction: column;
        align-items: stretch;
      }

      .header-actions {
        justify-content: flex-start;
      }

      .clock {
        text-align: left;
      }

      h1 {
        font-size: 39px;
      }

      h2 {
        font-size: 24px;
      }

      .segments,
      .theme-switch {
        width: fit-content;
      }

      .segments button,
      .theme-switch button {
        flex: 0 0 auto;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .tool-panel {
        padding: 18px;
        border-radius: 28px;
      }

      .inventory-row {
        border-radius: 24px;
      }

      .inventory-row .quantity-input {
        text-align: left;
      }

      .order-form {
        grid-template-columns: 1fr;
      }

      .order-form .btn {
        grid-column: auto;
      }

      .history-tools {
        grid-template-columns: 1fr;
      }

      .history-actions {
        justify-content: flex-start;
      }

      .order-item {
        grid-template-columns: 1fr;
        border-radius: 24px;
      }

      .order-meta,
      .remove-order {
        grid-column: auto;
      }

      .remove-order {
        width: fit-content;
      }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  <div class="app">
    <header class="app-header">
      <div class="header-row">
        <div class="brand">
          <h1>Daty</h1>
        </div>

        <div class="header-actions">
          <div class="clock" aria-live="polite" aria-label="Hor&aacute;rio atual">
            <strong id="horaAtual">00:00:00</strong>
          </div>

          <button type="button" class="btn btn-secondary" id="changeBackground" aria-label="Mudar fundo" data-tooltip="Mudar fundo">
            <svg class="icon" aria-hidden="true"><use href="#icon-image"></use></svg>
          </button>
          <button type="button" class="btn btn-secondary" id="removeBackground" aria-label="Tirar fundo" data-tooltip="Tirar fundo">
            <svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>
          </button>
          <input type="file" id="backgroundInput" accept="image/*" hidden />

          <div class="theme-switch" role="group" aria-label="Escolher tema">
            <button type="button" data-theme-choice="light" aria-label="Modo claro" data-tooltip="Modo claro">
              <svg class="icon" aria-hidden="true"><use href="#icon-sun"></use></svg>
            </button>
            <button type="button" data-theme-choice="dark" aria-label="Modo escuro" data-tooltip="Modo escuro">
              <svg class="icon" aria-hidden="true"><use href="#icon-moon"></use></svg>
            </button>
          </div>
        </div>
      </div>

      <nav class="segments" aria-label="Alternar area do Daty">
        <button type="button" class="is-active" data-view-target="estoque" aria-label="Estoque" data-tooltip="Estoque">
          <svg class="icon" aria-hidden="true"><use href="#icon-boxes"></use></svg>
        </button>
        <button type="button" data-view-target="pedidos" aria-label="Relat&oacute;rio" data-tooltip="Relat&oacute;rio">
          <svg class="icon" aria-hidden="true"><use href="#icon-list"></use></svg>
        </button>
      </nav>
    </header>

    <main>
      <section class="view is-active" id="estoqueView" data-view="estoque">
        <div class="stats" id="statsGrid" aria-label="Resumo do estoque e pedidos"></div>

        <section class="tool-panel" aria-labelledby="estoqueTitle">
          <div class="panel-head">
            <div>
              <h2 id="estoqueTitle">Estoque de etiquetas</h2>
              <p class="panel-copy">Acompanhe quantidades, salve a contagem e copie um resumo quando precisar.</p>
            </div>
            <div class="panel-actions">
              <button type="button" class="btn btn-secondary" id="addStockColor" aria-label="Adicionar cor" data-tooltip="Adicionar cor">
                <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
              </button>
            </div>
          </div>

          <div class="inventory-list" id="stockGrid"></div>

          <div class="actions">
            <button type="button" class="btn btn-primary" id="saveStock" aria-label="Salvar estoque" data-tooltip="Salvar estoque">
              <svg class="icon" aria-hidden="true"><use href="#icon-save"></use></svg>
            </button>
            <button type="button" class="btn btn-secondary" id="restoreStock" aria-label="Restaurar estoque" data-tooltip="Restaurar estoque">
              <svg class="icon" aria-hidden="true"><use href="#icon-rotate"></use></svg>
            </button>
            <button type="button" class="btn btn-secondary" id="copyStockReport" aria-label="Copiar relat&oacute;rio" data-tooltip="Copiar relat&oacute;rio">
              <svg class="icon" aria-hidden="true"><use href="#icon-copy"></use></svg>
            </button>
          </div>
        </section>
      </section>

      <section class="view" id="pedidosView" data-view="pedidos">
        <section class="tool-panel" aria-labelledby="pedidosTitle">
          <div class="panel-head">
            <div>
              <h2 id="pedidosTitle">Pedidos de etiquetas</h2>
              <p class="panel-copy">Registre cada pedido manual e mantenha o hist&oacute;rico organizado.</p>
            </div>
          </div>

          <div id="duplicateNotice" class="notice error" role="alert"></div>

          <form class="order-form" id="orderForm">
            <div class="field" id="nomeField">
              <label for="nome">Nome da pessoa</label>
              <input type="text" id="nome" placeholder="Digite o nome" autocomplete="off" required />
            </div>

            <div class="field">
              <label for="cor">Cor da etiqueta</label>
              <select id="cor" required>
                <option value="">Selecione</option>
              </select>
            </div>

            <div class="field">
              <label for="quantidade">Quantidade</label>
              <div class="quantity-toggle" role="group" aria-label="Selecionar quantidade">
                <button type="button" class="quantity-choice is-active" data-quantity-option="1200">1.200</button>
                <button type="button" class="quantity-choice" data-quantity-option="2500">2.500</button>
              </div>
              <input type="hidden" id="quantidade" value="1200" required />
            </div>

            <div class="field">
              <label for="rolos">Rolos</label>
              <input type="number" id="rolos" placeholder="Ex: 3" min="1" required />
            </div>

            <button type="submit" class="btn btn-primary" id="saveOrder" aria-label="Gravar pedido" data-tooltip="Gravar pedido">
              <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
            </button>
          </form>
        </section>

        <section class="tool-panel" aria-labelledby="historicoTitle">
          <div class="history-head">
            <div>
              <h2 id="historicoTitle">Hist&oacute;rico</h2>
              <p class="counter" id="counter">0 pedidos salvos</p>
            </div>

            <div class="history-actions">
              <button type="button" class="btn btn-secondary" id="downloadReport" aria-label="Salvar relat&oacute;rio" data-tooltip="Salvar relat&oacute;rio">
                <svg class="icon" aria-hidden="true"><use href="#icon-download"></use></svg>
              </button>
              <button type="button" class="btn btn-danger" id="clearHistory" aria-label="Limpar hist&oacute;rico" data-tooltip="Limpar hist&oacute;rico">
                <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
              </button>
            </div>
          </div>

          <div class="history-tools">
            <div class="history-search">
              <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
              <input type="search" id="historySearch" placeholder="Pesquisar por nome, cor, unidades ou dia" autocomplete="off" />
            </div>
            <button type="button" class="btn btn-secondary" id="clearSearch" aria-label="Limpar pesquisa" data-tooltip="Limpar pesquisa">
              <svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>
            </button>
          </div>

          <div class="order-list" id="orderList"></div>
        </section>
      </section>
    </main>

    <p class="footer">&copy; Lopsz 2026 / Wal Artes Gr&aacute;ficas</p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="colorModal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="colorModalTitle">
      <div class="modal-head">
        <h2 id="colorModalTitle">Adicionar cor</h2>
        <button type="button" class="btn btn-secondary" id="closeColorModal" aria-label="Fechar" data-tooltip="Fechar">
          <svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>
        </button>
      </div>

      <form class="color-form" id="colorForm">
        <div class="color-input-row">
          <div class="field">
            <label for="newColorName">Nome da cor</label>
            <input type="text" id="newColorName" placeholder="Ex: Dourada" autocomplete="off" required />
          </div>
          <div class="field">
            <label for="newColorValue">Cor</label>
            <div class="color-sample">
              <input type="color" id="newColorValue" value="#8e8e93" required />
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelColorModal" aria-label="Cancelar" data-tooltip="Cancelar">
            <svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>
          </button>
          <button type="submit" class="btn btn-primary" aria-label="Salvar cor" data-tooltip="Salvar cor">
            <svg class="icon" aria-hidden="true"><use href="#icon-save"></use></svg>
          </button>
        </div>
      </form>
    </section>
  </div>

  <script>
    const STOCK_KEY = "estoque_etiquetas_v1";
    const STOCK_ITEMS_KEY = "daty_stock_items_v2";
    const HISTORY_KEY = "historicoEtiquetas";
    const THEME_KEY = "daty_theme";
    const BACKGROUND_KEY = "daty_background_image_v1";
    const ALERT_STOCK_QUANTITY = 1;
    const ALERT_STOCK_NAMES = new Set(["branco", "branca pequena", "amarelo", "ribbon"]);
    const ORDER_QUANTITIES = [1200, 2500];

    const DEFAULT_STOCK_ITEMS = [
      { key: "rosa", name: "ROSA", orderName: "Rosa", color: "#efadb7" },
      { key: "branca", name: "BRANCA", orderName: "Branco", color: "#f2f2f2" },
      { key: "amarelo", name: "AMARELO", orderName: "Amarelo", color: "#ffee00" },
      { key: "branca_pequena", name: "BRANCA PEQUENA", detail: "Etiqueta menor", orderName: "Branca pequena", color: "#f2f2f2", small: true },
      { key: "ribbon", name: "RIBBON", orderName: "Ribbon", ribbon: true }
    ];

    let stockItems = carregarItensEstoque();
    let selectedOrderQuantity = "1200";

    const elements = {
      horaAtual: document.getElementById("horaAtual"),
      changeBackground: document.getElementById("changeBackground"),
      removeBackground: document.getElementById("removeBackground"),
      backgroundInput: document.getElementById("backgroundInput"),
      statsGrid: document.getElementById("statsGrid"),
      stockGrid: document.getElementById("stockGrid"),
      addStockColor: document.getElementById("addStockColor"),
      saveStock: document.getElementById("saveStock"),
      restoreStock: document.getElementById("restoreStock"),
      copyStockReport: document.getElementById("copyStockReport"),
      orderForm: document.getElementById("orderForm"),
      nomeInput: document.getElementById("nome"),
      nomeField: document.getElementById("nomeField"),
      corInput: document.getElementById("cor"),
      quantidadeInput: document.getElementById("quantidade"),
      rolosInput: document.getElementById("rolos"),
      saveOrder: document.getElementById("saveOrder"),
      duplicateNotice: document.getElementById("duplicateNotice"),
      orderList: document.getElementById("orderList"),
      historySearch: document.getElementById("historySearch"),
      clearSearch: document.getElementById("clearSearch"),
      counter: document.getElementById("counter"),
      downloadReport: document.getElementById("downloadReport"),
      clearHistory: document.getElementById("clearHistory"),
      toast: document.getElementById("toast"),
      colorModal: document.getElementById("colorModal"),
      colorForm: document.getElementById("colorForm"),
      closeColorModal: document.getElementById("closeColorModal"),
      cancelColorModal: document.getElementById("cancelColorModal"),
      newColorName: document.getElementById("newColorName"),
      newColorValue: document.getElementById("newColorValue")
    };

    let historico = carregarHistorico();
    let tooltipElement = null;
    let tooltipTarget = null;

    function criarId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return String(Date.now()) + "-" + Math.random().toString(16).slice(2);
    }

    function carregarHistorico() {
      try {
        const salvo = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        let precisaSalvar = false;
        const normalizado = salvo.map((item) => {
          if (item.id) return item;
          precisaSalvar = true;
          return { ...item, id: criarId() };
        });

        if (precisaSalvar) {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(normalizado));
        }

        return normalizado;
      } catch (error) {
        return [];
      }
    }

    function salvarHistorico() {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(historico));
    }

    function normalizarItemEstoque(item) {
      return {
        key: String(item.key || "").trim(),
        name: String(item.name || "").trim(),
        orderName: String(item.orderName || item.name || "").trim(),
        detail: String(item.detail || "").trim(),
        color: String(item.color || "#8e8e93").trim(),
        ribbon: Boolean(item.ribbon)
      };
    }

    function carregarItensEstoque() {
      try {
        const salvo = JSON.parse(localStorage.getItem(STOCK_ITEMS_KEY));
        if (Array.isArray(salvo)) {
          const validos = salvo
            .map(normalizarItemEstoque)
            .filter((item) => item.key && item.name && item.orderName);

          if (validos.length > 0) {
            return validos;
          }
        }
      } catch (error) {}

      return DEFAULT_STOCK_ITEMS.map(normalizarItemEstoque);
    }

    function salvarItensEstoque() {
      localStorage.setItem(STOCK_ITEMS_KEY, JSON.stringify(stockItems));
    }

    function getStockDefault() {
      return stockItems.reduce((acc, item) => {
        acc[item.key] = 0;
        return acc;
      }, {});
    }

    function lerEstoqueSalvo() {
      try {
        return JSON.parse(localStorage.getItem(STOCK_KEY)) || {};
      } catch (error) {
        return {};
      }
    }

    function salvarDadosEstoque(dados) {
      localStorage.setItem(STOCK_KEY, JSON.stringify(dados));
    }

    function getColorByOrder() {
      return stockItems.reduce((acc, item) => {
        acc[item.orderName] = item.color || "#1d1d1f";
        return acc;
      }, {});
    }

    function deveAlertarEstoque(item) {
      return ALERT_STOCK_NAMES.has(normalizarNome(item.orderName || item.name));
    }

    function formatarNomeCorPedido(nome) {
      return String(nome || "")
        .trim()
        .replace(/\s+/g, " ")
        .split(" ")
        .map((parte) => parte.charAt(0).toLocaleUpperCase("pt-BR") + parte.slice(1).toLocaleLowerCase("pt-BR"))
        .join(" ");
    }

    function criarChaveEtiqueta(nome) {
      const base = normalizarNome(nome)
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "") || "etiqueta";
      const usadas = new Set(stockItems.map((item) => item.key));
      let chave = base;
      let indice = 2;

      while (usadas.has(chave)) {
        chave = base + "_" + indice;
        indice += 1;
      }

      return chave;
    }

    function formatarNumero(numero) {
      return Number(numero || 0).toLocaleString("pt-BR");
    }

    function escaparTexto(texto) {
      return String(texto || "");
    }

    function normalizarNome(nome) {
      return String(nome || "")
        .trim()
        .replace(/\s+/g, " ")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLocaleLowerCase("pt-BR");
    }

    function nomeDuplicado(nome) {
      const alvo = normalizarNome(nome);
      if (!alvo) return false;
      return historico.some((item) => normalizarNome(item.nome) === alvo);
    }

    function corTexto(hex) {
      const valor = String(hex || "#111111").replace("#", "");
      if (valor.length !== 6) return "#ffffff";
      const r = parseInt(valor.slice(0, 2), 16);
      const g = parseInt(valor.slice(2, 4), 16);
      const b = parseInt(valor.slice(4, 6), 16);
      const brilho = (r * 299 + g * 587 + b * 114) / 1000;
      return brilho > 150 ? "#111111" : "#ffffff";
    }

    function mostrarToast(texto) {
      elements.toast.textContent = texto;
      elements.toast.classList.add("is-visible");
      clearTimeout(window.datyToastTimer);
      window.datyToastTimer = setTimeout(() => {
        elements.toast.classList.remove("is-visible");
      }, 2300);
    }

    function setTema(tema) {
      document.documentElement.setAttribute("data-theme", tema);
      localStorage.setItem(THEME_KEY, tema);
      document.querySelectorAll("[data-theme-choice]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.themeChoice === tema);
      });
    }

    function carregarTema() {
      const salvo = localStorage.getItem(THEME_KEY);
      if (salvo === "light" || salvo === "dark") {
        setTema(salvo);
        return;
      }

      const prefereEscuro = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      setTema(prefereEscuro ? "dark" : "light");
    }

    function aplicarFundoSite(imagem) {
      if (!imagem) {
        document.documentElement.style.removeProperty("--site-bg-image");
        document.documentElement.classList.remove("has-custom-bg");
        return;
      }

      document.documentElement.style.setProperty("--site-bg-image", 'url("' + String(imagem).replace(/"/g, '\\"') + '")');
      document.documentElement.classList.add("has-custom-bg");
    }

    function carregarFundoSite() {
      try {
        aplicarFundoSite(localStorage.getItem(BACKGROUND_KEY));
      } catch (error) {
        aplicarFundoSite("");
      }
    }

    function escolherFundoSite() {
      elements.backgroundInput.click();
    }

    function removerFundoSite() {
      try {
        localStorage.removeItem(BACKGROUND_KEY);
      } catch (error) {}

      aplicarFundoSite("");
      elements.backgroundInput.value = "";
      mostrarToast("Fundo removido.");
    }

    function alterarFundoSite(event) {
      const arquivo = event.target.files && event.target.files[0];
      if (!arquivo) return;

      if (!arquivo.type.startsWith("image/")) {
        alert("Escolha um arquivo de imagem.");
        elements.backgroundInput.value = "";
        return;
      }

      const leitor = new FileReader();
      leitor.addEventListener("load", () => {
        const imagem = String(leitor.result || "");
        aplicarFundoSite(imagem);

        try {
          localStorage.setItem(BACKGROUND_KEY, imagem);
          mostrarToast("Fundo atualizado.");
        } catch (error) {
          alert("A imagem foi aplicada, mas e grande demais para salvar no navegador.");
        }

        elements.backgroundInput.value = "";
      });
      leitor.readAsDataURL(arquivo);
    }

    function prepararTooltips() {
      document.querySelectorAll("[data-tooltip][title]").forEach((item) => {
        item.removeAttribute("title");
      });
    }

    function getTooltipElement() {
      if (tooltipElement) return tooltipElement;

      tooltipElement = document.createElement("div");
      tooltipElement.className = "floating-tooltip";
      tooltipElement.setAttribute("role", "tooltip");
      document.body.appendChild(tooltipElement);
      return tooltipElement;
    }

    function posicionarTooltip(alvo) {
      if (!alvo || !tooltipElement) return;

      const rect = alvo.getBoundingClientRect();
      const tooltip = tooltipElement;
      const margin = 10;
      const largura = tooltip.offsetWidth;
      const altura = tooltip.offsetHeight;
      const preferirAbaixo = Boolean(alvo.closest(".header-actions, .segments")) || rect.top < 78;
      let left = rect.left + rect.width / 2 - largura / 2;
      let top = preferirAbaixo ? rect.bottom + margin : rect.top - altura - margin;

      if (top < 8) top = rect.bottom + margin;
      if (top + altura > window.innerHeight - 8) top = Math.max(8, rect.top - altura - margin);
      left = Math.min(Math.max(8, left), window.innerWidth - largura - 8);

      tooltip.style.setProperty("--tooltip-x", left + "px");
      tooltip.style.setProperty("--tooltip-y", top + "px");
    }

    function mostrarTooltip(alvo) {
      if (!alvo || alvo.disabled) return;

      const texto = alvo.dataset.tooltip;
      if (!texto) return;

      alvo.removeAttribute("title");
      tooltipTarget = alvo;
      const tooltip = getTooltipElement();
      tooltip.textContent = texto;
      posicionarTooltip(alvo);
      tooltip.classList.add("is-visible");
    }

    function esconderTooltip() {
      tooltipTarget = null;
      if (tooltipElement) {
        tooltipElement.classList.remove("is-visible");
      }
    }

    function atualizarHora() {
      const agora = new Date();
      elements.horaAtual.textContent = agora.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function obterDiaAutomatico() {
      return new Date().toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        year: "2-digit"
      }).replace(/\//g, ".");
    }

    function renderizarOpcoesCor() {
      const valorAtual = elements.corInput.value;
      elements.corInput.innerHTML = "";

      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Selecione";
      elements.corInput.appendChild(placeholder);

      stockItems.forEach((item) => {
        const option = document.createElement("option");
        option.value = item.orderName;
        option.textContent = item.orderName;
        elements.corInput.appendChild(option);
      });

      const existeValorAtual = stockItems.some((item) => item.orderName === valorAtual);
      elements.corInput.value = existeValorAtual ? valorAtual : "";
    }

    function renderizarEstoque() {
      elements.stockGrid.innerHTML = "";

      if (stockItems.length === 0) {
        const vazio = document.createElement("div");
        vazio.className = "empty";
        vazio.textContent = "Nenhuma cor cadastrada.";
        elements.stockGrid.appendChild(vazio);
        renderizarResumo();
        return;
      }

      stockItems.forEach((item) => {
        const row = document.createElement("div");
        row.className = "inventory-row";
        row.dataset.key = item.key;
        row.style.setProperty("--stock-color", item.color || "#8e8e93");

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-stock";
        remove.dataset.removeStock = item.key;
        remove.setAttribute("aria-label", "Remover cor " + item.orderName);
        remove.setAttribute("data-tooltip", "Remover cor");
        remove.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>';

        const name = document.createElement("div");
        name.className = "item-name";

        const kicker = document.createElement("span");
        kicker.className = "stock-kicker";
        kicker.textContent = "Estoque";
        name.appendChild(kicker);

        const strong = document.createElement("strong");
        strong.textContent = item.name;
        name.appendChild(strong);

        if (item.detail) {
          const small = document.createElement("small");
          small.textContent = item.detail;
          name.appendChild(small);
        }

        const input = document.createElement("input");
        input.className = "quantity-input";
        input.id = item.key;
        input.dataset.stockInput = item.key;
        input.type = "number";
        input.min = "0";
        input.value = "0";
        input.inputMode = "numeric";
        input.setAttribute("aria-label", "Quantidade de " + item.name);

        row.appendChild(remove);
        row.appendChild(name);
        row.appendChild(input);

        elements.stockGrid.appendChild(row);
      });

      document.querySelectorAll("[data-stock-input]").forEach((input) => {
        input.addEventListener("input", atualizarAvisosEstoque);
        input.addEventListener("change", atualizarAvisosEstoque);
      });
    }

    function getDadosEstoque() {
      return stockItems.reduce((acc, item) => {
        const input = document.getElementById(item.key);
        acc[item.key] = Math.max(0, parseInt(input ? input.value : 0, 10) || 0);
        return acc;
      }, {});
    }

    function aplicarDadosEstoque(dados) {
      stockItems.forEach((item) => {
        const input = document.getElementById(item.key);
        if (input) {
          input.value = Number(dados[item.key] ?? 0);
        }
      });
      atualizarAvisosEstoque();
    }

    function carregarEstoque() {
      aplicarDadosEstoque({ ...getStockDefault(), ...lerEstoqueSalvo() });
    }

    function salvarEstoque() {
      salvarDadosEstoque(getDadosEstoque());
      mostrarToast("Estoque salvo.");
      atualizarAvisosEstoque();
    }

    function restaurarEstoque() {
      if (!confirm("Deseja restaurar todas as quantidades para zero?")) return;
      const estoqueZerado = getStockDefault();
      salvarDadosEstoque(estoqueZerado);
      aplicarDadosEstoque(estoqueZerado);
      mostrarToast("Estoque restaurado.");
    }

    function atualizarAvisosEstoque() {
      const dados = getDadosEstoque();
      const baixos = stockItems.filter((item) => {
        return deveAlertarEstoque(item) && dados[item.key] === ALERT_STOCK_QUANTITY;
      });

      document.querySelectorAll(".inventory-row").forEach((row) => {
        const item = stockItems.find((stockItem) => stockItem.key === row.dataset.key);
        row.classList.toggle(
          "is-low",
          Boolean(item && deveAlertarEstoque(item) && dados[row.dataset.key] === ALERT_STOCK_QUANTITY)
        );
      });

      renderizarResumo();
      return baixos;
    }

    async function copiarTexto(texto) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(texto);
        return;
      }

      const area = document.createElement("textarea");
      area.value = texto;
      area.style.position = "fixed";
      area.style.left = "-9999px";
      document.body.appendChild(area);
      area.focus();
      area.select();
      document.execCommand("copy");
      document.body.removeChild(area);
    }

    function textoRelatorioEstoque() {
      const dados = getDadosEstoque();
      const linhas = ["RELATORIO DE ESTOQUE - DATY", ""];
      let total = 0;

      stockItems.forEach((item) => {
        const qtd = Number(dados[item.key] || 0);
        total += qtd;
        linhas.push(item.name + ": " + qtd);
      });

      linhas.push("", "TOTAL: " + total + " unidades");
      return linhas.join("\n");
    }

    async function copiarRelatorioEstoque() {
      try {
        await copiarTexto(textoRelatorioEstoque());
        mostrarToast("Relatorio de estoque copiado.");
      } catch (error) {
        alert(textoRelatorioEstoque());
      }
    }

    function atualizarEstadoDuplicado() {
      const nome = elements.nomeInput.value.trim().replace(/\s+/g, " ");
      const duplicado = nomeDuplicado(nome);

      elements.nomeField.classList.toggle("has-error", duplicado);
      elements.saveOrder.disabled = duplicado;

      if (duplicado) {
        elements.duplicateNotice.textContent = 'Pedido duplicado: "' + nome + '" ja existe no historico. Use outro nome para gravar.';
        elements.duplicateNotice.classList.add("is-visible");
      } else {
        elements.duplicateNotice.textContent = "";
        elements.duplicateNotice.classList.remove("is-visible");
      }
    }

    function criarAmount(valor, rotulo) {
      const div = document.createElement("div");
      div.className = "amount";
      div.textContent = formatarNumero(valor);

      const span = document.createElement("span");
      span.textContent = rotulo;
      div.appendChild(span);

      return div;
    }

    function criarStatCard(rotulo, valor, cor) {
      const stat = document.createElement("div");
      stat.className = cor ? "stat color-stat" : "stat";

      if (cor) {
        stat.style.setProperty("--stat-color", cor);
      }

      const label = document.createElement("span");
      label.textContent = rotulo;

      const strong = document.createElement("strong");
      strong.textContent = typeof valor === "number" ? formatarNumero(valor) : valor;

      stat.appendChild(label);
      stat.appendChild(strong);
      elements.statsGrid.appendChild(stat);
    }

    function contarPedidosPorQuantidade(quantidade) {
      return historico.filter((item) => Number(item.quantidade || 0) === quantidade).length;
    }

    function getResumoCores() {
      const cores = new Map();

      stockItems.forEach((item) => {
        cores.set(normalizarNome(item.orderName), {
          nome: item.orderName,
          cor: item.color || "#8e8e93",
          total: 0
        });
      });

      historico.forEach((item) => {
        const chave = normalizarNome(item.cor);
        const resumo = cores.get(chave) || {
          nome: item.cor || "Sem cor",
          cor: "#8e8e93",
          total: 0
        };
        resumo.total += 1;
        cores.set(chave, resumo);
      });

      return Array.from(cores.values());
    }

    function renderizarResumo() {
      const dados = getDadosEstoque();
      const totalEstoque = stockItems.reduce((acc, item) => acc + Number(dados[item.key] || 0), 0);

      elements.statsGrid.innerHTML = "";
      criarStatCard("Total no estoque", totalEstoque);
      criarStatCard("Pedidos salvos", historico.length);
      criarStatCard("Pedidos 1.200", contarPedidosPorQuantidade(1200));
      criarStatCard("Pedidos 2.500", contarPedidosPorQuantidade(2500));

      getResumoCores().forEach((item) => {
        criarStatCard("Pedidos " + item.nome, item.total, item.cor);
      });
    }

    function normalizarBusca(valor) {
      return normalizarNome(valor).replace(/(\d)[^\d\s]+(?=\d)/g, "$1");
    }

    function textoBuscaHistorico(item) {
      return [
        item.nome,
        item.cor,
        item.dia,
        String(item.dia || "").replace(/\D/g, ""),
        item.hora,
        item.quantidade,
        formatarNumero(item.quantidade),
        item.rolos,
        formatarNumero(item.rolos)
      ].join(" ");
    }

    function getHistoricoFiltrado() {
      const termos = elements.historySearch.value
        .trim()
        .split(/\s+/)
        .map(normalizarBusca)
        .filter(Boolean);
      if (termos.length === 0) return historico;

      return historico.filter((item) => {
        const texto = normalizarBusca(textoBuscaHistorico(item));
        return termos.every((termo) => texto.includes(termo));
      });
    }

    function renderizarHistorico() {
      const lista = getHistoricoFiltrado();
      const pesquisando = Boolean(elements.historySearch.value.trim());
      elements.orderList.innerHTML = "";

      if (historico.length === 0) {
        elements.counter.textContent = "0 pedidos salvos";
        const vazio = document.createElement("div");
        vazio.className = "empty";
        vazio.textContent = "Nenhum pedido gravado ainda.";
        elements.orderList.appendChild(vazio);
        atualizarEstadoDuplicado();
        renderizarResumo();
        return;
      }

      if (pesquisando) {
        elements.counter.textContent = formatarNumero(lista.length) + " de " + formatarNumero(historico.length) + " pedidos encontrados";
      } else {
        elements.counter.textContent = historico.length === 1 ? "1 pedido salvo" : formatarNumero(historico.length) + " pedidos salvos";
      }

      if (lista.length === 0) {
        const vazio = document.createElement("div");
        vazio.className = "empty";
        vazio.textContent = "Nenhum pedido encontrado.";
        elements.orderList.appendChild(vazio);
        atualizarEstadoDuplicado();
        renderizarResumo();
        return;
      }

      const colorByOrder = getColorByOrder();

      lista.forEach((item) => {
        const cor = colorByOrder[item.cor] || "#8e8e93";
        const article = document.createElement("article");
        article.className = "order-item";
        article.style.setProperty("--order-color", cor);
        article.style.setProperty("--order-text", corTexto(cor));

        const main = document.createElement("div");
        main.className = "order-main";

        const strong = document.createElement("strong");
        strong.textContent = escaparTexto(item.nome);
        main.appendChild(strong);

        const small = document.createElement("small");
        small.textContent = "Dia: " + (item.dia || "Nao informado");
        main.appendChild(small);

        const colorWrap = document.createElement("div");
        const colorTag = document.createElement("span");
        colorTag.className = "color-pill";
        colorTag.textContent = escaparTexto(item.cor);
        colorWrap.appendChild(colorTag);

        const meta = document.createElement("div");
        meta.className = "order-meta";
        meta.textContent = "Gravado";

        const hora = document.createElement("small");
        hora.textContent = item.hora || "Sem horario";
        meta.appendChild(hora);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-order";
        remove.dataset.removeOrder = item.id;
        remove.setAttribute("aria-label", "Remover pedido");
        remove.setAttribute("data-tooltip", "Remover pedido");
        remove.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>';

        article.appendChild(main);
        article.appendChild(colorWrap);
        article.appendChild(criarAmount(item.quantidade, "etiquetas"));
        article.appendChild(criarAmount(item.rolos, "rolos"));
        article.appendChild(meta);
        article.appendChild(remove);
        elements.orderList.appendChild(article);
      });

      atualizarEstadoDuplicado();
      renderizarResumo();
    }

    function gerarTextoRelatorioPedidos() {
      const agora = new Date();
      const dataRelatorio = agora.toLocaleDateString("pt-BR");
      const horaRelatorio = agora.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      const totalEtiquetas = historico.reduce((acc, item) => acc + Number(item.quantidade || 0), 0);
      const totalRolos = historico.reduce((acc, item) => acc + Number(item.rolos || 0), 0);

      const linhas = [
        "RELATORIO DE PEDIDOS - DATY",
        "===========================",
        "",
        "Gerado em: " + dataRelatorio + " as " + horaRelatorio,
        "Total de pedidos: " + historico.length,
        "Total de etiquetas: " + formatarNumero(totalEtiquetas),
        "Total de rolos: " + formatarNumero(totalRolos),
        "",
        "PEDIDOS",
        "-------",
        ""
      ];

      historico.forEach((item, index) => {
        linhas.push(String(index + 1) + ". " + item.nome);
        linhas.push("Dia: " + (item.dia || "Nao informado"));
        linhas.push("Cor da etiqueta: " + item.cor);
        linhas.push("Quantidade de etiquetas: " + formatarNumero(item.quantidade));
        linhas.push("Quantidade de rolos: " + formatarNumero(item.rolos));
        linhas.push("Gravado as: " + (item.hora || "Sem horario"));
        linhas.push("-----------------------------");
      });

      return linhas.join("\n");
    }

    function baixarRelatorioPedidos() {
      if (historico.length === 0) {
        alert("Nao ha pedidos para salvar no relatorio.");
        return;
      }

      const texto = gerarTextoRelatorioPedidos();
      const arquivo = new Blob([texto], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(arquivo);
      const link = document.createElement("a");
      const data = new Date().toLocaleDateString("pt-BR").replace(/\//g, "-");

      link.href = url;
      link.download = "relatorio-daty-" + data + ".txt";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      mostrarToast("Relatorio salvo.");
    }

    function limparHistorico() {
      if (!confirm("Tem certeza que deseja limpar todo o historico?")) return;
      historico = [];
      salvarHistorico();
      renderizarHistorico();
      mostrarToast("Historico limpo.");
    }

    function removerPedido(id) {
      const pedido = historico.find((item) => item.id === id);
      if (!pedido) return;
      if (!confirm('Remover o pedido de "' + pedido.nome + '"?')) return;

      historico = historico.filter((item) => item.id !== id);
      salvarHistorico();
      renderizarHistorico();
      mostrarToast("Pedido removido.");
    }

    function abrirModalCor() {
      elements.newColorName.value = "";
      elements.newColorValue.value = "#8e8e93";
      elements.colorModal.classList.add("is-visible");
      elements.colorModal.setAttribute("aria-hidden", "false");
      setTimeout(() => elements.newColorName.focus(), 60);
    }

    function fecharModalCor() {
      elements.colorModal.classList.remove("is-visible");
      elements.colorModal.setAttribute("aria-hidden", "true");
    }

    function adicionarCor(event) {
      event.preventDefault();

      const nomePedido = formatarNomeCorPedido(elements.newColorName.value);
      if (!nomePedido) {
        alert("Digite o nome da cor.");
        elements.newColorName.focus();
        return;
      }

      const duplicada = stockItems.some((item) => normalizarNome(item.orderName) === normalizarNome(nomePedido));
      if (duplicada) {
        alert('A cor "' + nomePedido + '" ja existe no estoque.');
        elements.newColorName.focus();
        return;
      }

      const item = {
        key: criarChaveEtiqueta(nomePedido),
        name: nomePedido.toLocaleUpperCase("pt-BR"),
        orderName: nomePedido,
        detail: "",
        color: elements.newColorValue.value || "#8e8e93",
        ribbon: false
      };
      const dados = getDadosEstoque();

      stockItems.push(item);
      dados[item.key] = 0;
      salvarItensEstoque();
      salvarDadosEstoque(dados);
      renderizarOpcoesCor();
      renderizarEstoque();
      aplicarDadosEstoque({ ...getStockDefault(), ...dados });
      elements.corInput.value = item.orderName;
      renderizarHistorico();
      fecharModalCor();
      mostrarToast("Cor adicionada.");
    }

    function removerCorEstoque(key) {
      const item = stockItems.find((stockItem) => stockItem.key === key);
      if (!item) return;
      if (!confirm('Remover a cor "' + item.orderName + '"? O historico de pedidos existente sera mantido.')) return;

      const dados = getDadosEstoque();
      delete dados[key];
      stockItems = stockItems.filter((stockItem) => stockItem.key !== key);
      salvarItensEstoque();
      salvarDadosEstoque(dados);
      renderizarOpcoesCor();
      renderizarEstoque();
      aplicarDadosEstoque({ ...getStockDefault(), ...dados });
      renderizarHistorico();
      mostrarToast("Cor removida.");
    }

    function setQuantidadePedido(valor) {
      const quantidade = ORDER_QUANTITIES.includes(Number(valor)) ? String(valor) : String(ORDER_QUANTITIES[0]);
      selectedOrderQuantity = quantidade;
      elements.quantidadeInput.value = quantidade;

      document.querySelectorAll("[data-quantity-option]").forEach((button) => {
        const ativo = button.dataset.quantityOption === quantidade;
        button.classList.toggle("is-active", ativo);
        button.setAttribute("aria-pressed", ativo ? "true" : "false");
      });
    }

    function gravarPedido(event) {
      event.preventDefault();

      const nome = elements.nomeInput.value.trim().replace(/\s+/g, " ");
      const cor = elements.corInput.value;
      const quantidade = Number(elements.quantidadeInput.value);
      const rolos = Number(elements.rolosInput.value);
      const dia = obterDiaAutomatico();

      if (!nome || !cor || !quantidade || !rolos) {
        alert("Preencha todos os campos antes de gravar.");
        return;
      }

      if (nomeDuplicado(nome)) {
        atualizarEstadoDuplicado();
        elements.nomeInput.focus();
        mostrarToast("Pedido bloqueado por nome duplicado.");
        return;
      }

      if (!ORDER_QUANTITIES.includes(quantidade)) {
        alert("Escolha 1.200 ou 2.500 etiquetas.");
        const ativo = document.querySelector("[data-quantity-option].is-active") || document.querySelector("[data-quantity-option]");
        if (ativo) ativo.focus();
        return;
      }

      if (rolos < 1) {
        alert("A quantidade de rolos precisa ser pelo menos 1.");
        elements.rolosInput.focus();
        return;
      }

      const agora = new Date();
      const hora = agora.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      historico.unshift({
        id: criarId(),
        nome,
        cor,
        quantidade,
        rolos,
        dia,
        hora
      });

      salvarHistorico();
      renderizarHistorico();
      elements.orderForm.reset();
      setQuantidadePedido("1200");
      elements.nomeInput.focus();
      mostrarToast("Pedido gravado.");
    }

    function alternarView(view) {
      document.querySelectorAll("[data-view]").forEach((section) => {
        section.classList.toggle("is-active", section.dataset.view === view);
      });

      document.querySelectorAll("[data-view-target]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.viewTarget === view);
      });
    }

    document.querySelectorAll("[data-theme-choice]").forEach((button) => {
      button.addEventListener("click", () => setTema(button.dataset.themeChoice));
    });

    document.querySelectorAll("[data-view-target]").forEach((button) => {
      button.addEventListener("click", () => alternarView(button.dataset.viewTarget));
    });

    elements.saveStock.addEventListener("click", salvarEstoque);
    elements.restoreStock.addEventListener("click", restaurarEstoque);
    elements.copyStockReport.addEventListener("click", copiarRelatorioEstoque);
    elements.addStockColor.addEventListener("click", abrirModalCor);
    elements.changeBackground.addEventListener("click", escolherFundoSite);
    elements.removeBackground.addEventListener("click", removerFundoSite);
    elements.backgroundInput.addEventListener("change", alterarFundoSite);
    elements.orderForm.addEventListener("submit", gravarPedido);
    elements.downloadReport.addEventListener("click", baixarRelatorioPedidos);
    elements.clearHistory.addEventListener("click", limparHistorico);
    elements.colorForm.addEventListener("submit", adicionarCor);
    elements.closeColorModal.addEventListener("click", fecharModalCor);
    elements.cancelColorModal.addEventListener("click", fecharModalCor);
    elements.historySearch.addEventListener("input", renderizarHistorico);
    elements.clearSearch.addEventListener("click", () => {
      elements.historySearch.value = "";
      renderizarHistorico();
      elements.historySearch.focus();
    });

    elements.nomeInput.addEventListener("input", atualizarEstadoDuplicado);
    elements.stockGrid.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove-stock]");
      if (button) removerCorEstoque(button.dataset.removeStock);
    });
    elements.orderList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove-order]");
      if (button) removerPedido(button.dataset.removeOrder);
    });
    elements.colorModal.addEventListener("click", (event) => {
      if (event.target === elements.colorModal) fecharModalCor();
    });
    document.querySelectorAll("[data-quantity-option]").forEach((button) => {
      button.addEventListener("click", () => setQuantidadePedido(button.dataset.quantityOption));
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && elements.colorModal.classList.contains("is-visible")) {
        fecharModalCor();
      }
    });
    document.addEventListener("pointerover", (event) => {
      const alvo = event.target.closest("[data-tooltip]");
      if (alvo) mostrarTooltip(alvo);
    });
    document.addEventListener("pointerout", (event) => {
      if (!tooltipTarget) return;
      if (event.relatedTarget && tooltipTarget.contains(event.relatedTarget)) return;
      esconderTooltip();
    });
    document.addEventListener("focusin", (event) => {
      const alvo = event.target.closest("[data-tooltip]");
      if (alvo) mostrarTooltip(alvo);
    });
    document.addEventListener("focusout", esconderTooltip);
    document.addEventListener("click", esconderTooltip);
    window.addEventListener("resize", () => {
      if (tooltipTarget) posicionarTooltip(tooltipTarget);
    });
    document.addEventListener("scroll", () => {
      if (tooltipTarget) posicionarTooltip(tooltipTarget);
    }, true);

    carregarTema();
    carregarFundoSite();
    setQuantidadePedido(selectedOrderQuantity);
    renderizarOpcoesCor();
    renderizarEstoque();
    carregarEstoque();
    renderizarHistorico();
    prepararTooltips();
    atualizarHora();
    setInterval(atualizarHora, 1000);
  </script>
</body>
</html>
